# Isolated Ultra Studio 2.0 release smoke test.
# Run from the integration checkout with:
# docker compose -p ultrastudio2-final-smoke -f compose.smoke.yml up -d --build
# Do not combine with docker-compose.yml or compose.yml.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - smoke_mongo:/data/db

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: ultra_studio_smoke
      CORS_ORIGINS: http://localhost:3002
      COMFYUI_OUTPUT_DIR: /comfyui-output
      MEDIA_LIBRARY_URL: http://host.docker.internal:8010
    ports:
      - "127.0.0.1:8002:8001"
    volumes:
      - smoke_renders:/app/renders
      - smoke_comfy_output:/comfyui-output
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      REACT_APP_BACKEND_URL: ""
      WDS_SOCKET_PORT: "3002"
      HOST: 0.0.0.0
      PORT: "3000"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "127.0.0.1:3002:3000"

volumes:
  smoke_mongo:
  smoke_renders:
  smoke_comfy_output:
