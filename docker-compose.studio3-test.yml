# Isolated Ultra Studio 3 development test stack.
# Uses project-scoped containers and volumes, with no host-published MongoDB port.
# Set COMFYUI_HOST_OUTPUT_DIR to the host's ComfyUI output directory so Gallery
# can read and delete output files. Example on this machine: G:/Comfy.ui/output
# Start with: docker compose -p ultra-studio3-test -f docker-compose.studio3-test.yml up -d --build
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - studio3_test_mongo:/data/db

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: ultra_studio3_test
      CORS_ORIGINS: "http://localhost:3013,http://127.0.0.1:3013,http://100.89.192.127:3013,http://drag3m-1.tail5fea95.ts.net:3013"
      COMFYUI_OUTPUT_DIR: /comfyui-output
      MEDIA_LIBRARY_URL: http://host.docker.internal:8010
    ports:
      - "127.0.0.1:8013:8001"
    volumes:
      - studio3_test_renders:/app/renders
      - ${COMFYUI_HOST_OUTPUT_DIR:-./backend/renders}:/comfyui-output
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      REACT_APP_BACKEND_URL: ""
      WDS_SOCKET_PORT: "3013"
      HOST: 0.0.0.0
      PORT: "3000"
      CHOKIDAR_USEPOLLING: "true"
    # Publish the frontend for phone testing over Tailscale; Windows Firewall limits access to the tailnet.
    ports:
      - "3013:3000"

volumes:
  studio3_test_mongo:
  studio3_test_renders:
